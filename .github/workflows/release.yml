name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          - os: macos-latest
            target: aarch64-apple-darwin

          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set artifact name
        shell: bash
        run: |
          version="$(git describe --tags --match='v*.*.*' --always)"
          name="roxy-$version-${{ matrix.target }}"
          echo "ARTIFACT_NAME=$name" >> $GITHUB_ENV

          echo "version: $version"
          echo "artifact: $name"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Configure musl build dependencies
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Configure aarch64 musl linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-Clink-arg=-lgcc" >> "$GITHUB_ENV"

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }} --color=always --verbose

      - name: Package
        if: runner.os != 'Windows'
        run: >
          tar -cv
          LICENSE README.md
          man/
          skills/
          -C contrib/ completions/ -C ../
          -C target/${{ matrix.target }}/release/ roxy
          | gzip --best > '${{ env.ARTIFACT_NAME }}.tar.gz'

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/roxy.exe .
          7z a '${{ env.ARTIFACT_NAME }}.zip' LICENSE README.md man skills contrib/completions roxy.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip

  packslip:
    name: Sign packslip
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Sign release
        id: packslip
        uses: jdx/packslip@v1
        with:
          download: roxy-*.tar.gz roxy-*.zip
          bin: roxy
          upload: false
          resources: |
            completion/bash=archive:completions/roxy.bash
            completion/zsh=archive:completions/_roxy
            completion/fish=archive:completions/roxy.fish
            completion/powershell=archive:completions/_roxy.ps1
            completion/elvish=archive:completions/roxy.elv
            man=archive:man/man1/roxy.1
            man=archive:man/man1/roxy-register.1
            man=archive:man/man1/roxy-run.1
            man=archive:man/man1/roxy-trust.1
            man=archive:man/man1/roxy-unregister.1
            skill/roxy=archive:skills/roxy

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish-packslip:
    name: Publish packslip
    needs: packslip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: packslip-bundle
          path: packslip

      - name: Upload bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json
          --repo "$GITHUB_REPOSITORY" --clobber
